name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile src and test
        run: |
          mkdir -p bin
          javac -d bin -cp lib/junit-platform-console-standalone-1.14.4.jar $(find src test -name '*.java')

      - name: Run tests
        run: java -jar lib/junit-platform-console-standalone-1.14.4.jar execute --class-path bin --scan-class-path --details=tree --fail-if-no-tests
